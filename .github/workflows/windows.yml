name: Windows UCRT64 reference validation
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build and test native Windows binaries
        shell: msys2 {0}
        run: |
          export UCRT64_ROOT="$(cygpath -m /ucrt64)"
          cmake --preset windows-debug
          cmake --build --preset windows-debug -j 2
          cmake --build --preset windows-debug --target all_exercises -j 2
          ctest --preset windows-debug
          cmake --preset windows-release
          cmake --build --preset windows-release -j 2
          ctest --preset windows-release
          cmake --preset windows-avx512
          cmake --build --preset windows-avx512 -j 2
          ctest --preset windows-avx512
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-logs
          path: build/*/Testing/Temporary/LastTest.log
